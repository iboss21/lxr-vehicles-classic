<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐺 LXR Vehicles Classic</title>
  <style>
    /* ══════════════════════════════════════════════════════
       🐺 LXR VEHICLES CLASSIC — NUI STYLES
       wolves.land | The Land of Wolves | © 2026 iBoss21
       ══════════════════════════════════════════════════════ */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      user-select: none;
      overflow: hidden;
    }

    /* ─── SHOP OVERLAY ─────────────────────────────────── */
    #lxr-shop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #lxr-shop-overlay.active { display: flex; }

    /* ─── SHOP PANEL ───────────────────────────────────── */
    #lxr-shop-panel {
      width: 780px;
      max-height: 88vh;
      background: linear-gradient(160deg, #0d0d12 0%, #131320 60%, #0b0b14 100%);
      border: 1px solid rgba(186, 144, 64, 0.35);
      border-radius: 12px;
      box-shadow:
        0 0 40px rgba(186, 144, 64, 0.12),
        0 0 80px rgba(0, 0, 0, 0.8),
        inset 0 0 20px rgba(186, 144, 64, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── HEADER ────────────────────────────────────────── */
    #lxr-shop-header {
      padding: 20px 28px 16px;
      border-bottom: 1px solid rgba(186, 144, 64, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, rgba(186, 144, 64, 0.08) 0%, transparent 100%);
    }
    #lxr-shop-header .brand {
      display: flex; flex-direction: column; gap: 2px;
    }
    #lxr-shop-header .brand-wolf {
      font-size: 10px;
      color: #ba9040;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.7;
    }
    #lxr-shop-header .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: #e8c870;
      text-shadow: 0 0 16px rgba(186, 144, 64, 0.4);
      letter-spacing: 2px;
    }
    #lxr-shop-header .dealer-name {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 2px;
      letter-spacing: 1px;
    }
    #lxr-close-btn {
      background: rgba(186, 144, 64, 0.08);
      border: 1px solid rgba(186, 144, 64, 0.25);
      color: #ba9040;
      width: 36px; height: 36px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    #lxr-close-btn:hover {
      background: rgba(186, 144, 64, 0.2);
      color: #e8c870;
      box-shadow: 0 0 12px rgba(186, 144, 64, 0.3);
    }

    /* ─── TABS ──────────────────────────────────────────── */
    #lxr-tabs {
      display: flex;
      padding: 12px 28px 0;
      gap: 4px;
      border-bottom: 1px solid rgba(186, 144, 64, 0.12);
    }
    .lxr-tab {
      padding: 9px 22px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lxr-tab:hover { color: rgba(255,255,255,0.7); }
    .lxr-tab.active {
      color: #e8c870;
      border-bottom-color: #ba9040;
    }

    /* ─── BODY ──────────────────────────────────────────── */
    #lxr-shop-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 28px 20px;
    }
    #lxr-shop-body::-webkit-scrollbar { width: 4px; }
    #lxr-shop-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
    #lxr-shop-body::-webkit-scrollbar-thumb { background: rgba(186,144,64,0.3); border-radius: 2px; }

    /* ─── TAB PANELS ─────────────────────────────────────── */
    .lxr-panel { display: none; }
    .lxr-panel.active { display: block; }

    /* ─── SECTION LABEL ──────────────────────────────────── */
    .lxr-section-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: rgba(186,144,64,0.6);
      text-transform: uppercase;
      margin: 16px 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .lxr-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(186,144,64,0.15);
    }

    /* ─── VEHICLE GRID ───────────────────────────────────── */
    #lxr-vehicle-grid, #lxr-garage-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    /* ─── VEHICLE CARD ───────────────────────────────────── */
    .lxr-vehicle-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(186,144,64,0.12);
      border-radius: 8px;
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s;
      position: relative;
    }
    .lxr-vehicle-card:hover {
      background: rgba(186,144,64,0.07);
      border-color: rgba(186,144,64,0.3);
      box-shadow: 0 4px 20px rgba(186,144,64,0.1);
      transform: translateY(-1px);
    }
    .lxr-vehicle-card.owned {
      border-color: rgba(80,180,100,0.35);
      background: rgba(80,180,100,0.04);
    }
    .lxr-vehicle-card.owned:hover {
      border-color: rgba(80,180,100,0.6);
    }
    .lxr-vehicle-card .owned-badge {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(80,180,100,0.2);
      border: 1px solid rgba(80,180,100,0.4);
      color: #50b464;
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .lxr-vehicle-icon {
      font-size: 24px;
      text-align: center;
      opacity: 0.8;
    }
    .lxr-vehicle-name {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .lxr-vehicle-type {
      font-size: 9px;
      color: rgba(186,144,64,0.6);
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .lxr-vehicle-price {
      font-size: 14px;
      font-weight: 700;
      color: #e8c870;
      text-align: center;
      text-shadow: 0 0 8px rgba(186,144,64,0.3);
    }
    .lxr-vehicle-btns {
      display: flex;
      gap: 6px;
    }
    /* ─── BUTTONS ────────────────────────────────────────── */
    .lxr-btn {
      flex: 1;
      padding: 8px 4px;
      border-radius: 6px;
      border: none;
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .lxr-btn-buy {
      background: linear-gradient(135deg, rgba(186,144,64,0.9), rgba(230,190,80,0.9));
      color: #0d0d12;
      box-shadow: 0 2px 8px rgba(186,144,64,0.3);
    }
    .lxr-btn-buy:hover {
      background: linear-gradient(135deg, #ba9040, #e8c870);
      box-shadow: 0 4px 16px rgba(186,144,64,0.5);
      transform: translateY(-1px);
    }
    .lxr-btn-spawn {
      background: rgba(80,180,100,0.15);
      border: 1px solid rgba(80,180,100,0.35);
      color: #50b464;
    }
    .lxr-btn-spawn:hover {
      background: rgba(80,180,100,0.25);
      border-color: rgba(80,180,100,0.6);
    }
    .lxr-btn-delete {
      background: rgba(200,60,60,0.12);
      border: 1px solid rgba(200,60,60,0.25);
      color: #c83c3c;
    }
    .lxr-btn-delete:hover {
      background: rgba(200,60,60,0.22);
      border-color: rgba(200,60,60,0.5);
    }
    .lxr-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ─── FOOTER ─────────────────────────────────────────── */
    #lxr-shop-footer {
      padding: 12px 28px;
      border-top: 1px solid rgba(186,144,64,0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(186,144,64,0.03);
    }
    #lxr-shop-footer .footer-hint {
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #lxr-shop-footer .footer-brand {
      font-size: 10px;
      color: rgba(186,144,64,0.35);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ─── EMPTY STATE ─────────────────────────────────────── */
    .lxr-empty {
      text-align: center;
      padding: 40px 0;
      color: rgba(255,255,255,0.2);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .lxr-empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }
  </style>
</head>
<body>

  <!-- ╔═══════════════════════════════════════════════════════╗
       ║   🐺 LXR VEHICLES CLASSIC — DEALERSHIP / GARAGE UI  ║
       ╚═══════════════════════════════════════════════════════╝ -->
  <div id="lxr-shop-overlay">
    <div id="lxr-shop-panel">

      <!-- Header -->
      <div id="lxr-shop-header">
        <div class="brand">
          <span class="brand-wolf">🐺 wolves.land — The Land of Wolves</span>
          <span class="brand-title">LXR VEHICLE DEALER</span>
          <span class="dealer-name" id="lxr-dealer-name">St Denis Dealership</span>
        </div>
        <button id="lxr-close-btn" onclick="closeShop()">✕</button>
      </div>

      <!-- Tabs -->
      <div id="lxr-tabs">
        <button class="lxr-tab active" onclick="switchTab('shop',this)">🛒 Buy</button>
        <button class="lxr-tab" onclick="switchTab('garage',this)">🏠 My Garage</button>
      </div>

      <!-- Body -->
      <div id="lxr-shop-body">

        <!-- ── BUY PANEL ── -->
        <div class="lxr-panel active" id="panel-shop">
          <div class="lxr-section-label">Available Vehicles</div>
          <div id="lxr-vehicle-grid"></div>
        </div>

        <!-- ── GARAGE PANEL ── -->
        <div class="lxr-panel" id="panel-garage">
          <div class="lxr-section-label">Your Owned Vehicles</div>
          <div id="lxr-garage-grid"></div>
        </div>

      </div>

      <!-- Footer -->
      <div id="lxr-shop-footer">
        <span class="footer-hint">ESC / [✕] to close</span>
        <span class="footer-brand">🐺 wolves.land</span>
      </div>
    </div>
  </div>

  <!-- ╔═══════════════════════════════════════════════════════╗
       ║   SOUND ENGINE + NUI LOGIC                           ║
       ╚═══════════════════════════════════════════════════════╝ -->
  <script>
    // ═══════════════════════════════════════════════
    // 🐺 SOUND ENGINE
    // ═══════════════════════════════════════════════
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    class SoundEngine {
      constructor() {
        this.maxSpeed          = 30;
        this.speedToVolumeRatio = 0.1;
        this.speedToPitchRatio  = 7.0;
        this.minVolume          = 0.15;
        this.gainNode           = audioContext.createGain();
        this.gainNode.connect(audioContext.destination);
        this.sourceNode         = null;
      }

      calculateVolume(speed) {
        let v = speed / this.maxSpeed * this.speedToVolumeRatio;
        return Math.max(v, this.minVolume);
      }

      calculatePitch(speed) {
        const semitones = speed / this.maxSpeed * this.speedToPitchRatio;
        return Math.pow(2, semitones / 12);
      }

      simulateSound(speed) {
        this.gainNode.gain.setValueAtTime(this.calculateVolume(speed), audioContext.currentTime);
      }

      async loadSoundFile(filename) {
        const response    = await fetch(filename);
        const arrayBuffer = await response.arrayBuffer();
        return audioContext.decodeAudioData(arrayBuffer);
      }

      async startPlayback(filename, volumeOverride = null) {
        const buffer     = await this.loadSoundFile(filename);
        this.sourceNode  = audioContext.createBufferSource();
        this.sourceNode.buffer = buffer;
        this.sourceNode.loop   = false;
        this.sourceNode.connect(this.gainNode);
        this.sourceNode.start();
        if (volumeOverride !== null)
          this.gainNode.gain.setValueAtTime(volumeOverride, audioContext.currentTime);
      }

      async startIdlePlayback(filename) {
        const buffer     = await this.loadSoundFile(filename);
        this.sourceNode  = audioContext.createBufferSource();
        this.sourceNode.buffer = buffer;
        this.sourceNode.loop   = true;
        this.sourceNode.connect(this.gainNode);
        this.sourceNode.start();
      }

      stopPlayback() {
        if (this.sourceNode) {
          this.sourceNode.stop();
          this.sourceNode.disconnect();
          this.sourceNode = null;
        }
      }

      updateSpeed(speed, minVolume = this.minVolume) {
        this.minVolume   = minVolume;
        this.simulateSound(speed);
        this.adjustPlaybackRate(this.calculatePitch(speed));
      }

      adjustPlaybackRate(pitch) {
        if (this.sourceNode && this.sourceNode.playbackRate)
          this.sourceNode.playbackRate.setValueAtTime(pitch, audioContext.currentTime);
      }
    }

    const engine = new SoundEngine();

    // ═══════════════════════════════════════════════
    // 🐺 SHOP STATE
    // ═══════════════════════════════════════════════
    let currentDealerIndex = null;
    let currentVehicleList = [];
    let currentGarage      = [];

    // ─── Tab switching ───────────────────────────
    function switchTab(tab, btn) {
      document.querySelectorAll('.lxr-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.lxr-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }

    // ─── Close shop ─────────────────────────────
    function closeShop() {
      document.getElementById('lxr-shop-overlay').classList.remove('active');
      fetch('https://lxr-vehicles-classic/closeShop', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({})
      });
    }

    // ─── Buy vehicle ────────────────────────────
    function buyVehicle(vehicleKey, price) {
      if (!confirm(`Purchase ${vehicleKey} for $${price.toLocaleString()}?`)) return;
      fetch('https://lxr-vehicles-classic/buyVehicle', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({vehicleKey: vehicleKey, dealerIndex: currentDealerIndex})
      });
    }

    // ─── Spawn vehicle (from garage) ────────────
    function spawnVehicle(vehicleKey) {
      fetch('https://lxr-vehicles-classic/spawnVehicle', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({vehicleKey: vehicleKey})
      });
      closeShop();
    }

    // ─── Delete garage vehicle ──────────────────
    function deleteVehicle(vehicleId, vehicleName) {
      if (!confirm(`Remove ${vehicleName} from your garage? This cannot be undone.`)) return;
      fetch('https://lxr-vehicles-classic/deleteVehicle', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({vehicleId: vehicleId})
      });
    }

    // ─── Type icon ──────────────────────────────
    function typeIcon(type) {
      const icons = {
        car:'🚗', bike:'🏍️', boat:'⛵', heli:'🚁', plane:'✈️',
        jet:'🛩️', tank:'🪖', osprey:'🚁', cargobob:'🚁'
      };
      return icons[type] || '🚗';
    }

    // ─── Format price ─────────────────────────────
    function fmt(n) { return '$' + Number(n).toLocaleString(); }

    // ─── Build buy grid ──────────────────────────
    function buildShopGrid(vehicles) {
      const grid = document.getElementById('lxr-vehicle-grid');
      grid.innerHTML = '';
      if (!vehicles || !vehicles.length) {
        grid.innerHTML = '<div class="lxr-empty"><div class="lxr-empty-icon">🚫</div>No vehicles available.</div>';
        return;
      }
      vehicles.forEach(v => {
        const card = document.createElement('div');
        card.className = 'lxr-vehicle-card' + (v.owned ? ' owned' : '');
        card.innerHTML = `
          ${v.owned ? '<span class="owned-badge">Owned</span>' : ''}
          <div class="lxr-vehicle-icon">${typeIcon(v.vtype)}</div>
          <div class="lxr-vehicle-name">${v.label}</div>
          <div class="lxr-vehicle-type">${v.vtype}</div>
          <div class="lxr-vehicle-price">${fmt(v.price)}</div>
          <div class="lxr-vehicle-btns">
            ${!v.owned
              ? `<button class="lxr-btn lxr-btn-buy" onclick="buyVehicle('${v.key}', ${v.price})">Buy</button>`
              : `<button class="lxr-btn lxr-btn-spawn" onclick="spawnVehicle('${v.key}')">Spawn</button>`
            }
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ─── Build garage grid ────────────────────────
    function buildGarageGrid(garage) {
      const grid = document.getElementById('lxr-garage-grid');
      grid.innerHTML = '';
      if (!garage || !garage.length) {
        grid.innerHTML = '<div class="lxr-empty"><div class="lxr-empty-icon">🏠</div>Your garage is empty.</div>';
        return;
      }
      garage.forEach(g => {
        const card = document.createElement('div');
        card.className = 'lxr-vehicle-card owned';
        card.innerHTML = `
          <div class="lxr-vehicle-icon">🚗</div>
          <div class="lxr-vehicle-name">${g.name || g.modelname}</div>
          <div class="lxr-vehicle-type">${g.type || 'car'}</div>
          <div class="lxr-vehicle-btns">
            <button class="lxr-btn lxr-btn-spawn" onclick="spawnVehicle('${g.name}')">Spawn</button>
            <button class="lxr-btn lxr-btn-delete" onclick="deleteVehicle(${g.id}, '${g.name}')">Sell</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // ═══════════════════════════════════════════════
    // 🐺 NUI MESSAGE HANDLER
    // ═══════════════════════════════════════════════
    window.addEventListener('message', function(event) {
      const data = event.data;

      switch (data.key || data.type) {

        // ── Sound Engine ──────────────────────────
        case 'onStartVehicle':
          engine.startPlayback(data.soundFile, 0.3);
          break;
        case 'onEnteredVehicle':
          engine.startIdlePlayback(data.soundFile);
          break;
        case 'onStopVehicle':
          engine.stopPlayback();
          engine.startPlayback(data.soundFile, 0.3);
          break;
        case 'onSpeedChanged':
          engine.updateSpeed(data.value, data.minVolume);
          break;

        // ── Dealership ───────────────────────────
        case 'openShop':
          currentDealerIndex = data.dealerIndex;
          currentVehicleList = data.vehicles  || [];
          currentGarage      = data.garage    || [];
          document.getElementById('lxr-dealer-name').textContent = data.dealerName || 'Vehicle Dealer';
          buildShopGrid(currentVehicleList);
          buildGarageGrid(currentGarage);
          // Reset to buy tab
          document.querySelectorAll('.lxr-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.lxr-panel').forEach(p => p.classList.remove('active'));
          document.querySelector('.lxr-tab').classList.add('active');
          document.getElementById('panel-shop').classList.add('active');
          document.getElementById('lxr-shop-overlay').classList.add('active');
          break;

        case 'refreshGarage':
          currentGarage = data.garage || [];
          buildGarageGrid(currentGarage);
          // Also refresh owned status in shop grid
          if (currentVehicleList.length) {
            currentVehicleList.forEach(v => {
              v.owned = currentGarage.some(g => g.modelname === v.model);
            });
            buildShopGrid(currentVehicleList);
          }
          break;

        default:
          break;
      }
    });

    // ─── ESC key close ───────────────────────────
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeShop();
    });
  </script>

</body>
</html>
